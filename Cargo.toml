[package]
name = "noap-server"
version = "1.0.0"
edition = "2021"
description = "Noap backend - Rust port (Axum + MongoDB)"
license = "ISC"

[[bin]]
name = "noap-server"
path = "src/main.rs"

[[bin]]
name = "noap-vercel"
path = "api/index.rs"

[dependencies]
axum = { version = "0.8", features = ["json", "macros"] }
tokio = { version = "1.38", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }
vercel_runtime = { version = "2.4", features = ["axum"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mongodb = { version = "3.1", default-features = false, features = ["compat-3-0-0", "rustls-tls", "dns-resolver"] }
bson = { version = "2.15", features = ["chrono-0_4"] }
futures = "0.3"
jsonwebtoken = "9.3"
bcrypt = "0.17"
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "builder", "hostname", "smtp-transport"] }
qrcode = { version = "0.14", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
totp-rs = { version = "5.6", features = ["qr", "gen_secret"] }
base64 = "0.22"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "2.0"
